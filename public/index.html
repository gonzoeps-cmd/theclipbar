<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TheClipBar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>TheClipBar</h1>
    <p class="tagline">Paste a channel handle, find recent videos, clip the good parts.</p>
  </header>

  <main>
    <form id="lookup-form" class="lookup-form">
      <div class="field">
        <label for="platform">Platform</label>
        <select id="platform" name="platform">
          <option value="youtube">YouTube</option>
          <option value="twitch">Twitch</option>
        </select>
      </div>
      <div class="field field-grow">
        <label for="handle">Channel handle / username</label>
        <input id="handle" name="handle" type="text" placeholder="e.g. @mkbhd or shroud" autocomplete="off" required />
      </div>
      <div class="field twitch-type-field hidden" id="twitch-type-field">
        <label>Twitch content</label>
        <div class="segmented" id="twitch-type" role="radiogroup" aria-label="Twitch content type">
          <button type="button" class="segmented-btn active" data-type="videos" role="radio" aria-checked="true">Videos</button>
          <button type="button" class="segmented-btn" data-type="clips" role="radio" aria-checked="false">Clips</button>
        </div>
      </div>
      <div class="field hidden" id="clip-range-field">
        <label for="clip-range">Clip range</label>
        <select id="clip-range" name="clip-range">
          <option value="all">All time</option>
          <option value="30d" selected>Last 30 days</option>
          <option value="7d">Last 7 days</option>
          <option value="24h">Last 24 hours</option>
        </select>
      </div>
      <button type="submit" id="submit-btn">Look up</button>
    </form>

    <div class="favorites-row">
      <div class="favorites-dropdown hidden" id="favorites-dropdown-youtube">
        <button type="button" id="favorites-toggle-youtube" class="favorites-toggle" aria-haspopup="true" aria-expanded="false">
          <span>★ YouTube Favorites</span>
          <span class="favorites-count" id="favorites-count-youtube">0</span>
          <span class="caret">&#9662;</span>
        </button>
        <div class="favorites-menu hidden" id="favorites-menu-youtube"></div>
      </div>
      <div class="favorites-dropdown hidden" id="favorites-dropdown-twitch">
        <button type="button" id="favorites-toggle-twitch" class="favorites-toggle" aria-haspopup="true" aria-expanded="false">
          <span>★ Twitch Favorites</span>
          <span class="favorites-count" id="favorites-count-twitch">0</span>
          <span class="caret">&#9662;</span>
        </button>
        <div class="favorites-menu hidden" id="favorites-menu-twitch"></div>
      </div>
    </div>

    <div id="status" class="status" role="status"></div>

    <section id="channel-card" class="channel-card hidden"></section>

    <section id="results" class="results"></section>

    <button type="button" id="load-more-btn" class="load-more-btn hidden">Load more</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
